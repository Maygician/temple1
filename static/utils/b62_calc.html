<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>base62 calc</title>
</head>

<body>
    <p>from b62</p>
    <textarea name="" id="fromb" onchange="document.getElementById('tod').value=decode(this.value)"></textarea>
    <p>to decimal</p>
    <textarea name="" id="tod"></textarea>
    <p>vice versa</p>
    <p>from decimal</p>
    <textarea name="" id="fromd" onchange="document.getElementById('tob').value=encode(this.value)"></textarea>
    <p>to base62</p>
    <textarea name="" id="tob"></textarea>
    <script>
        "use strict";

        var CHARSET = "0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

        // NB: does not validate input
        function encode(int) {
            if (int === 0) {
                return CHARSET[0];
            }

            var res = "";
            while (int > 0) {
                res = CHARSET[int % 62] + res;
                int = Math.floor(int / 62);
            }
            return res;
        };

        function decode(str) {
            var res = 0,
                length = str.length,
                i, char;
            for (i = 0; i < length; i++) {
                char = str.charCodeAt(i);
                if (char < 58) { // 0-9
                    char = char - 48;
                } else if (char < 91) { // A-Z
                    char = char - 29;
                } else { // a-z
                    char = char - 87;
                }
                res += char * Math.pow(62, length - i - 1);
            }
            return res;
        };

    </script>
</body>

</html>
